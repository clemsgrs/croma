[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mari"
version = "0.1.0"
description = "Margin-aware robustness metrics for pathology foundation models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Full benchmarking + data preparation + plotting pipeline.
bench = [
  "rich>=13.0",
  "huggingface_hub>=0.24",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "torch",
  "timm",
  "transformers",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.scripts]
mari = "mari.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
