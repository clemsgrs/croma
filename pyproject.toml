[build-system]
# >=1.27 for PEP 639 (`license` as an SPDX expression, `license-files`). Older hatchling
# renders `license = {file = ...}` as a 12k-character `License:` metadata header, which
# PyPI rejects with a bare 400.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "croma"
version = "0.2.0"
description = "Robustness metrics for pathology foundation models: RI, MaRI, CRoMa, APD, and nIPD."
readme = "README.md"
requires-python = ">=3.10"
# An SPDX expression, not `{ file = ... }`. Under Metadata 2.4 the file form inlines the
# whole licence text into a single `License:` header -- 12,765 characters for Apache-2.0 --
# and PyPI answers with an undetailed 400. NOTICE travels alongside because the BSD
# 3-Clause code vendored in croma.downstream requires its notice to accompany
# redistributions (ADR-0011).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
  { name = "Jeroen van der Laak" },
  { name = "Geert Litjens" },
]
keywords = [
  "pathology",
  "foundation-models",
  "robustness",
  "representation-learning",
  "metrics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  # No `License ::` classifier: PyPI rejects one alongside a `License-Expression`.
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/clemsgrs/croma"
Documentation = "https://clemsgrs.github.io/croma/"
Repository = "https://github.com/clemsgrs/croma"
Issues = "https://github.com/clemsgrs/croma/issues"
Changelog = "https://github.com/clemsgrs/croma/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Extra deps for reproducing the paper (data prep, embedding, plotting pipeline).
repro = [
  "rich>=13.0",
  "huggingface_hub>=0.24",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "torch",
  "timm",
  "transformers",
  "Pillow>=10.0",
  # PDF -> SVG for the committed documentation figures (scripts/tools/build_doc_figures.py).
  # Not in the `docs` extra: the site renders committed SVG and converts nothing at build time.
  "pymupdf>=1.24",
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  # Capped below the next major: black's style changes between majors, so an unpinned
  # formatter turns a green CI red on code nobody touched.
  "black~=26.5",
]
docs = [
  "sphinx>=8.1",
  "furo",
  "sphinx-copybutton",
  "sphinx-autodoc-typehints",
]

# There is deliberately no `encoders` extra. The four encoder sources it used to pin are
# only available as git URLs, and PyPI rejects any distribution whose metadata carries a
# direct reference (`name @ git+https://...`) with an undetailed 400 -- `allow-direct-references`
# only gets such a project past the *build*. They now live in
# `scripts/bench/requirements-encoders.txt`, which is where the script that needs them is.

[project.scripts]
croma = "croma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/croma"]

# The BSD 3-Clause licence croma vendors PathoROB's APD reduction under requires the
# copyright notice to travel with binary redistributions too, so NOTICE has to be inside
# the wheel and not merely committed. hatchling's default license-files glob already
# mirrors it into dist-info/licenses/, but that is an implicit default we do not declare;
# this places it next to the package explicitly, where an installed croma can point at it.
[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "croma/NOTICE"

# Enumerate the sdist explicitly rather than letting hatchling walk the repo root. The
# working tree carries large, git-ignored trees (data/, output/, paper/) and untracked
# scratch, and hatchling's default is "everything not VCS-ignored" -- which would both
# ship scratch to PyPI and make the build crawl.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  # The published benchmark results (ADR-0016). A few tens of KB describing the package's
  # own evaluation, and tests/test_results_export.py reads them, so an sdist without them
  # ships a test suite that cannot run.
  "/results",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]
exclude = [
  "/docs/_build",
  "/scripts/experiments",
  "**/.ipynb_checkpoints",
  "**/__pycache__",
  # Paper tooling (ADR-0012). These are git-ignored, but an `include` entry overrides
  # VCS-ignore in hatchling, so "/scripts" and "/docs" would drag them in. Without this a
  # build on a machine that has the tree -- the only kind of machine that has it -- ships
  # to PyPI exactly what the repository declines to publish, and a CI build from a clean
  # checkout would silently produce a different sdist.
  "/scripts/repro",
  "/tests/test_paper_artifacts.py",
  "/tests/test_generate_model_tables.py",
  "/tests/test_dataset_montage.py",
  "/tests/test_scale_scatter.py",
  "/docs/adr/0010-paper-sections-are-build-outputs.md",
]

# Formatting is enforced on the packaged code and its tests only -- the paths a PyPI user
# or a reviewer actually reads. scripts/ is repro machinery and is deliberately not gated;
# see the lint job in .github/workflows/ci.yaml.
[tool.black]
line-length = 100
# Match requires-python. Black 26 otherwise targets the newest Python it knows, and then
# refuses its own safety check when run on an older interpreter than the one it formatted for.
target-version = ["py310"]
include = '^/(src|tests)/.*\.py$'
# Vendored third-party code is frozen: it must stay byte-identical to the upstream
# revision it was copied from, because "APD" only means PathoROB's APD if croma runs
# PathoROB's own code. black 26.5 happens to leave it unchanged, but a formatter is not
# something to be lucky about across version bumps -- `force-exclude` applies even when
# the path is reached through an explicit `src tests` argument, so the exclusion holds
# for the CI invocation as written.
force-exclude = '^/src/croma/downstream/_pathorob\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
