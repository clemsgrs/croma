[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
# Distribution name. Target is the bare `croma` (pending PyPI name acquisition);
# if that name is unavailable, fall back to the reserved `croma-metrics`:
# name = "croma-metrics"
name = "croma"
version = "0.1.0"
description = "Robustness metrics for pathology foundation models: counts, margins, and cross-confounder ratios."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Extra deps for reproducing the paper (data prep, embedding, plotting pipeline).
repro = [
  "rich>=13.0",
  "huggingface_hub>=0.24",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "torch",
  "timm",
  "transformers",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.scripts]
croma = "croma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/croma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
