[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "croma"
version = "0.1.0"
description = "Metrics-only library for pathology foundation model robustness: RI, MaRI, and CRoMa."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
  { name = "Jeroen van der Laak" },
  { name = "Geert Litjens" },
]
keywords = [
  "pathology",
  "foundation-models",
  "robustness",
  "representation-learning",
  "metrics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/clemsgrs/croma"
Documentation = "https://clemsgrs.github.io/croma/"
Repository = "https://github.com/clemsgrs/croma"
Issues = "https://github.com/clemsgrs/croma/issues"
Changelog = "https://github.com/clemsgrs/croma/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Extra deps for reproducing the paper (data prep, embedding, plotting pipeline).
repro = [
  "rich>=13.0",
  "huggingface_hub>=0.24",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "torch",
  "timm",
  "transformers",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  # Capped below the next major: black's style changes between majors, so an unpinned
  # formatter turns a green CI red on code nobody touched.
  "black~=26.5",
]
docs = [
  "sphinx>=8.1",
  "furo",
  "sphinx-copybutton",
  "sphinx-autodoc-typehints",
]
encoders = [
  "musk @ git+https://github.com/lilab-stanford/MUSK.git",
  "conch @ git+https://github.com/Mahmoodlab/CONCH.git",
  "trident @ git+https://github.com/mahmoodlab/TRIDENT.git",
  "gigapath @ git+https://github.com/prov-gigapath/prov-gigapath.git",
]

[project.scripts]
croma = "croma.cli:main"

[tool.hatch.metadata]
# The optional `encoders` extra pins encoder sources by git URL (PEP 508 direct
# references); hatchling rejects those during metadata generation unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/croma"]

# Enumerate the sdist explicitly rather than letting hatchling walk the repo root. The
# working tree carries large, git-ignored trees (data/, output/, paper/) and untracked
# scratch, and hatchling's default is "everything not VCS-ignored" -- which would both
# ship scratch to PyPI and make the build crawl.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "/docs/_build",
  "/scripts/experiments",
  "**/.ipynb_checkpoints",
  "**/__pycache__",
]

# Formatting is enforced on the packaged code and its tests only -- the paths a PyPI user
# or a reviewer actually reads. scripts/ is repro machinery and is deliberately not gated;
# see the lint job in .github/workflows/ci.yaml.
[tool.black]
line-length = 100
# Match requires-python. Black 26 otherwise targets the newest Python it knows, and then
# refuses its own safety check when run on an older interpreter than the one it formatted for.
target-version = ["py310"]
include = '^/(src|tests)/.*\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
