name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      # The repo has already carried a 1.0.0 tag while pyproject said 0.1.0. A version is
      # immutable once uploaded, so catch the mismatch before it reaches PyPI, not after.
      - name: Assert the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag '${TAG}' does not match pyproject version '${VERSION}'"
            exit 1
          fi
          echo "tag ${TAG} matches version ${VERSION}"

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      # `twine check` validates the description renders; it says nothing about what PyPI
      # will accept. A direct reference (`name @ git+https://...`) builds fine, passes
      # `twine check --strict`, and is then refused at upload with a bare 400 -- after the
      # tag exists. Fail here instead, where it costs nothing.
      - name: Reject direct-reference dependencies
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          name = next(n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".dist-info/METADATA"))
          meta = zipfile.ZipFile(wheel).read(name).decode()
          bad = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist") and ("git+" in line or " @ " in line)
          ]
          if bad:
              print("::error::PyPI rejects direct references in metadata:")
              for line in bad:
                  print(f"  {line}")
              sys.exit(1)
          print("no direct references in Requires-Dist")
          PY

      # `on: release` already implies github.ref is refs/tags/<tag>, so the old
      # startsWith(github.ref, 'refs/tags/') guard could never be false.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --verbose because PyPI's rejections arrive as a bare "400 Bad Request" otherwise,
        # and this step only runs once the tag exists -- there is no cheap second attempt.
        run: twine upload --verbose dist/*

