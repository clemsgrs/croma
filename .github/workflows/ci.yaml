name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Format (black)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          python -m pip install "black~=26.5"

      # The README carries a black badge, so this is what makes it a fact rather than a
      # claim. Scope, line length and target version all come from [tool.black] in
      # pyproject.toml -- passing paths here instead would let the two disagree.
      - name: Check formatting
        run: black --check --diff src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  package:
    name: Build and check distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      # release.yaml runs this same pair at publish time, where a failure means a broken
      # tag. Running it per-PR moves packaging breakage to where it is cheap to fix.
      - name: Validate distribution metadata
        run: twine check --strict dist/*

      # The sdist is an explicit include list, so a new top-level directory silently joins
      # it. Fail loudly rather than shipping scratch to PyPI.
      - name: Assert the sdist carries no scratch
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(\.ipynb_checkpoints|__pycache__|/experiments/|/_build/)'; then
            echo "::error::scratch files leaked into the sdist"
            exit 1
          fi

      # These are absent from a clean checkout, so this never fires here. It is a tripwire
      # for a build run where the tree *does* exist -- a local `python -m build`, or a
      # release cut from a working machine -- because an `include` entry overrides
      # VCS-ignore and would otherwise publish the paper tooling. See ADR-0012.
      - name: Assert the sdist carries no paper tooling
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(/scripts/repro/|test_paper_artifacts|adr/0010-)'; then
            echo "::error::local-only paper tooling leaked into the sdist"
            exit 1
          fi

